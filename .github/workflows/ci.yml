name: Patients CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patients-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  signed-android-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    env:
      EMR_BASE_URL: ${{ vars.EMR_BASE_URL }}
      AUTH_SERVER_BASE_URL: ${{ vars.AUTH_SERVER_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Provision release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in EMR_BASE_URL AUTH_SERVER_BASE_URL ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            test -n "${!name}" || { echo "::error::$name is not configured"; exit 1; }
          done
          [[ "$EMR_BASE_URL" == https://* ]] || { echo "::error::EMR_BASE_URL must use HTTPS"; exit 1; }
          [[ "$AUTH_SERVER_BASE_URL" == https://* ]] || { echo "::error::AUTH_SERVER_BASE_URL must use HTTPS"; exit 1; }

          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=app/upload-keystore.jks
          EOF
          keytool -list -keystore android/app/upload-keystore.jks \
            -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
            -keypass "$ANDROID_KEY_PASSWORD" >/dev/null
      - run: flutter pub get
      - name: Build obfuscated app bundle
        run: >-
          flutter build appbundle --release --obfuscate
          --split-debug-info=build/debug-info
          --dart-define=EMR_BASE_URL="$EMR_BASE_URL"
          --dart-define=AUTH_SERVER_BASE_URL="$AUTH_SERVER_BASE_URL"
      - name: Verify release artifact
        shell: bash
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          aab=build/app/outputs/bundle/release/app-release.aab
          test -s "$aab"
          jarsigner -verify "$aab"
          expected="$(keytool -J-Duser.language=en -list -v \
            -keystore android/app/upload-keystore.jks -storepass "$ANDROID_STORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" -keypass "$ANDROID_KEY_PASSWORD" |
            awk '/SHA256:/{print $2; exit}')"
          actual="$(keytool -J-Duser.language=en -printcert -jarfile "$aab" |
            awk '/SHA256:/{print $2; exit}')"
          test -n "$expected" && test "$actual" = "$expected"
          sha256sum "$aab" > "$aab.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: patients-android-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/app-release.aab.sha256
            build/debug-info/
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks
